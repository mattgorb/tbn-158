# 1.3B / tbn158_t4 (tile_size=4) — SUB-BIT ABLATION at 1.3B / 100B tokens.
# Doubles compression vs default tbn158 (tile_size=2), targeting ~0.40 bits/weight.
# Paper headline: same model size as BitNet b1.58 paper, but at <0.5 bits/weight.
#
# Global batch = 8 × 8 chips × 4 accum = 256 seqs × 2048 = 524K tokens/step.
# 200000 steps × 524K ≈ 105B tokens.
per_device_batch_size: 8
gradient_accumulation_steps: 4
seq_len: 2048
lr: 3.0e-4
steps: 200000
warmup_steps: 2000
weight_decay: 0.1
save_steps: 1000
save_total_limit: 3
logging_steps: 50
eval_steps: 1000
eval_samples: 1024
bf16: false

# 1.3B / tbn158 — paper-grade 100B-token run on 2× A100 80 GB (FSDP).
# Matches BitNet b1.58 paper's 1.3B-scale comparison.
#
# Global batch = 16 × 2 GPUs × 8 accum = 256 sequences × 2048 = 524K tokens/step.
# 200000 steps × 524K ≈ 105B tokens.
#
# Memory budget (1.3B model on 2× A100 80GB with FSDP):
#   - Sharded weights (bf16):    ~1.3 GB / GPU
#   - Sharded grads (bf16):      ~1.3 GB / GPU
#   - Sharded Adam state (fp32): ~8 GB  / GPU
#   - State subtotal:            ~11 GB / GPU
#   - Activations (batch=16, seq=2048, grad_ckpt=true): ~10-15 GB / GPU
#   - Total:                     ~25 GB / GPU (well under 80 GB limit)
#
# Wall-clock: ~25-35 days at typical 2× A100 throughput with FSDP.
per_device_batch_size: 16
gradient_accumulation_steps: 8
seq_len: 2048
lr: 3.0e-4
steps: 200000
warmup_steps: 2000
weight_decay: 0.1
save_steps: 1000
save_total_limit: 3
logging_steps: 50
eval_steps: 1000
eval_samples: 1024
bf16: false
no_gradient_checkpointing: false   # keep ON for safety; 1.3B has headroom to flip if needed

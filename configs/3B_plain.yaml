# 3B / plain — single 48 GB GPU baseline. Tight; use accumulation for larger
# effective batch. For multi-GPU, prefer FSDP/ZeRO via `accelerate launch`.
per_device_batch_size: 1
gradient_accumulation_steps: 1
seq_len: 2048
lr: 3.0e-4
steps: 10000
warmup_steps: 500
weight_decay: 0.1
save_steps: 500
save_total_limit: 4
logging_steps: 10
no_gradient_checkpointing: false

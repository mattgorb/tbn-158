# Accelerate config for 3B FSDP on 2× A100 80 GB.
# Use with: accelerate launch --config_file configs/accelerate_fsdp_2gpu.yaml pretrain.py ...
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 2
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: LlamaDecoderLayer
  fsdp_backward_prefetch: BACKWARD_PRE
  # SHARDED_STATE_DICT: each rank writes its own shard. Avoids the rank-0 RAM
  # spike (~30GB for 3B Adam state) that OOMs JupyterHub-class containers
  # during save. Final checkpoint must be consolidated for lm-eval (see
  # scripts/consolidate_fsdp.sh).
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_use_orig_params: true
  fsdp_sync_module_states: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_forward_prefetch: false
  # Leave activation checkpointing to HF Trainer (gradient_checkpointing=True).
  fsdp_activation_checkpointing: false

# 500M / plain — target 10B tokens on 2× A100 80 GB (DDP).
# Launcher: torchrun --nproc_per_node=2 pretrain.py --size 500M --variant plain
# Global batch = 8 × 2gpu × 8accum = 128 seqs × 2048 = 262K tokens/step → 38000 steps ≈ 10B tokens.
per_device_batch_size: 8
gradient_accumulation_steps: 8
seq_len: 2048
lr: 4.0e-4
steps: 38000
warmup_steps: 1000
weight_decay: 0.1
save_steps: 1000
save_total_limit: 4
logging_steps: 10

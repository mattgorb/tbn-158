# Accelerate config for Cloud TPU v6e-8 (1 host, 8 chips × 32 GB HBM = 256 GB).
# Single host = simplest TPU path. Recommended starting point.
#
# Use with:
#   accelerate launch --config_file configs/accelerate_tpu_v6e_8.yaml pretrain.py ...
#
# FSDP (XLA SPMD) is enabled so 3B model+grads+Adam state shard across 8 chips
# (model alone is fine on a chip, but fp32 Adam state pushes total > 32 GB).
compute_environment: LOCAL_MACHINE
distributed_type: XLA
mixed_precision: bf16
num_machines: 1
num_processes: 8
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
downcast_bf16: 'no'
tpu_use_cluster: false
tpu_use_sudo: false
# FSDP is configured via HF TrainingArguments in pretrain.py (auto-enabled when
# PJRT_DEVICE=TPU). Don't put fsdp keys here — they're not in accelerate's
# XLA cluster-config schema and will error on launch.

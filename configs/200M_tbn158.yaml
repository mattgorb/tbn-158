# 200M / tbn158 — target 2B tokens on 1× 48 GB GPU.
# Launcher: python pretrain.py --size 200M --variant tbn158
# Global batch = 8 × 16 = 128 seqs × 2048 = 262K tokens/step → 8000 steps ≈ 2.1B tokens.
per_device_batch_size: 8
gradient_accumulation_steps: 16
seq_len: 2048
lr: 5.0e-4
steps: 8000
warmup_steps: 200
weight_decay: 0.1
save_steps: 500
save_total_limit: 4
logging_steps: 10

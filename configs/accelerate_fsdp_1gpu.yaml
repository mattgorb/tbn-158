# Accelerate FSDP smoke-test on 1× 48 GB GPU.
# Same as accelerate_fsdp_2gpu.yaml but num_processes: 1 — exercises the FSDP
# code paths (auto-wrap, state dict, gradient checkpointing) without the 2-GPU
# sharding. Use to validate the FSDP setup with 200M before the 3B 2-GPU run.
#
# Run: accelerate launch --config_file configs/accelerate_fsdp_1gpu.yaml \
#          pretrain.py --size 200M --variant tbn158
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 1
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: LlamaDecoderLayer
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_use_orig_params: true
  fsdp_sync_module_states: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_forward_prefetch: false
  fsdp_activation_checkpointing: false
